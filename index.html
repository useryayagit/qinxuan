<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Weex Location 最终测试</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #000; color: #0f0; }
    .log { margin: 5px 0; white-space: pre-wrap; }
    .success { color: #0f0; }
    .error { color: #f00; }
    .info { color: #ff0; }
  </style>
</head>
<body>
  <h1>Weex Location 最终测试</h1>
  <div id="logs"></div>
   
  <script>
    (function() {
      var logs = document.getElementById('logs');
      
      function log(msg, className) {
        var div = document.createElement('div');
        div.className = 'log ' + (className || '');
        div.textContent = msg;
        logs.appendChild(div);
      }
      
      log('[*] 开始测试...', 'info');
      
      // 检查 Weex
      if (typeof weex !== 'undefined') {
        log('[+] Weex 存在', 'success');
        
        try {
          // 尝试使用 Weex location 模块
          var locationModule = weex.requireModule('location');
          log('[+] Weex location 模块可用', 'success');
          
          // 调用 getCurrentPosition
          locationModule.getCurrentPosition(function(result) {
            log('\n[+] Weex location 成功！', 'success');
            log('结果：' + JSON.stringify(result, null, 2), 'success');
          }, function(error) {
            log('\n[-] Weex location 失败：' + JSON.stringify(error), 'error');
          });
          
        } catch (e) {
          log('[-] Weex location 异常：' + e, 'error');
        }
        
      } else {
        log('[-] Weex 不存在', 'error');
      }
      
      // 检查 YoukuJSBridge
      log('\n[*] 检查 YoukuJSBridge...', 'info');
      
      if (typeof YoukuJSBridge !== 'undefined') {
        log('[+] YoukuJSBridge 存在 (类型：' + typeof YoukuJSBridge + ')', 'success');
        
        // 尝试列出所有属性
        log('\n[*] YoukuJSBridge 的属性:', 'info');
        for (var key in YoukuJSBridge) {
          log('  - ' + key + ' (类型：' + typeof YoukuJSBridge[key] + ')', 'info');
        }
        
        // 尝试使用 eval 调用
        log('\n[*] 尝试使用 eval 调用 doPay...', 'info');
        try {
          var result = eval('YoukuJSBridge.doPay(\'{"orderId":"TEST","amount":0.01}\')');
          log('[+] eval 调用成功！返回值：' + result, 'success');
        } catch (e) {
          log('[-] eval 调用失败：' + e, 'error');
        }
        
        // 尝试使用 Function 构造器
        log('\n[*] 尝试使用 Function 构造器...', 'info');
        try {
          var fn = new Function('return YoukuJSBridge["doPay"](\'{"orderId":"TEST","amount":0.01}\')');
          var result = fn();
          log('[+] Function 构造器成功！返回值：' + result, 'success');
        } catch (e) {
          log('[-] Function 构造器失败：' + e, 'error');
        }
        
      } else {
        log('[-] YoukuJSBridge 不存在', 'error');
      }
      
      log('\n[*] 测试完成', 'info');
    })();
  </script>
</body>
</html>
