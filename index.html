<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>终极测试</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #000; color: #0f0; }
    .log { margin: 5px 0; white-space: pre-wrap; }
    .success { color: #0f0; }
    .error { color: #f00; }
    .info { color: #ff0; }
  </style>
</head>
<body>
  <h1>终极测试 - 所有可能的访问方式</h1>
  <div id="logs"></div>
   
  <script>
    (function() {
      var logs = document.getElementById('logs');
      
      function log(msg, className) {
        var div = document.createElement('div');
        div.className = 'log ' + (className || '');
        div.textContent = msg;
        logs.appendChild(div);
      }
      
      log('[*] 开始终极测试...', 'info');
      
      // 方式 1: 直接访问
      log('\n[*] 方式 1: 直接访问 YoukuJSBridge', 'info');
      log('typeof YoukuJSBridge: ' + typeof YoukuJSBridge, 'info');
      log('typeof window.YoukuJSBridge: ' + typeof window.YoukuJSBridge, 'info');
      log('typeof this.YoukuJSBridge: ' + typeof this.YoukuJSBridge, 'info');
      
      // 方式 2: 检查 window 对象的所有属性
      log('\n[*] 方式 2: 搜索 window 对象中的 Bridge', 'info');
      for (var key in window) {
        if (key.toLowerCase().indexOf('bridge') !== -1 || 
            key.toLowerCase().indexOf('youku') !== -1 ||
            key.toLowerCase().indexOf('js') !== -1) {
          log('  发现：' + key + ' (类型：' + typeof window[key] + ')', 'success');
        }
      }
      
      // 方式 3: 检查全局对象
      log('\n[*] 方式 3: 检查全局对象', 'info');
      log('window === this: ' + (window === this), 'info');
      log('Object.keys(window).length: ' + Object.keys(window).length, 'info');
      
      // 方式 4: 延迟访问（1 秒后）
      log('\n[*] 方式 4: 延迟 1 秒后访问...', 'info');
      setTimeout(function() {
        log('延迟后 typeof YoukuJSBridge: ' + typeof YoukuJSBridge, 'info');
        log('延迟后 typeof window.YoukuJSBridge: ' + typeof window.YoukuJSBridge, 'info');
        
        // 方式 5: 尝试调用
        if (typeof YoukuJSBridge !== 'undefined') {
          log('\n[+] YoukuJSBridge 存在！', 'success');
          
          try {
            var result = YoukuJSBridge.doPay('{"test":true}');
            log('[+] doPay 成功：' + result, 'success');
          } catch (e) {
            log('[-] doPay 失败：' + e, 'error');
          }
        } else {
          log('\n[-] YoukuJSBridge 仍然不存在', 'error');
          log('\n[*] 可能的原因:', 'info');
          log('  1. 页面加载太快，对象还未注入', 'info');
          log('  2. JavaScript 被部分禁用', 'info');
          log('  3. 需要使用特殊的访问方式', 'info');
        }
        
        log('\n[*] 终极测试完成', 'info');
      }, 1000);
      
    })();
  </script>
</body>
</html>
