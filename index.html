<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>简单测试</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
    .log { margin: 5px 0; }
    .success { color: #0f0; }
    .error { color: #f00; }
    .info { color: #ff0; }
  </style>
</head>
<body>
  <h1>YoukuJSBridge 测试</h1>
  <div id="logs"></div>
   
  <script>
    var logs = document.getElementById('logs');
    
    function log(msg, className) {
      var div = document.createElement('div');
      div.className = 'log ' + (className || '');
      div.textContent = msg;
      logs.appendChild(div);
    }
    
    // 延迟 2 秒执行，确保 YoukuJSBridge 已注入
    setTimeout(function() {
      log('[*] 开始探测...', 'info');
      log('[*] typeof YoukuJSBridge: ' + typeof YoukuJSBridge, 'info');
      
      if (typeof YoukuJSBridge !== 'undefined') {
        log('[+] YoukuJSBridge 存在！', 'success');
        
        // 尝试直接调用
        try {
          log('[*] 调用 doPay...', 'info');
          var result = YoukuJSBridge.doPay('{"orderId":"TEST","amount":0.01}');
          log('[+] doPay 成功！返回值：' + result, 'success');
        } catch (e) {
          log('[-] doPay 失败：' + e.message, 'error');
        }
        
        try {
          log('[*] 调用 getGeolocation...', 'info');
          var result = YoukuJSBridge.getGeolocation('{}');
          log('[+] getGeolocation 成功！返回值：' + result, 'success');
        } catch (e) {
          log('[-] getGeolocation 失败：' + e.message, 'error');
        }
        
        try {
          log('[*] 调用 loadUrl...', 'info');
          YoukuJSBridge.loadUrl('{"url":"about:blank"}');
          log('[+] loadUrl 成功！', 'success');
        } catch (e) {
          log('[-] loadUrl 失败：' + e.message, 'error');
        }
        
        try {
          log('[*] 调用 setShareInfo...', 'info');
          YoukuJSBridge.setShareInfo('{"title":"Test"}');
          log('[+] setShareInfo 成功！', 'success');
        } catch (e) {
          log('[-] setShareInfo 失败：' + e.message, 'error');
        }
        
      } else {
        log('[-] YoukuJSBridge 不存在', 'error');
      }
      
      log('[*] 探测完成', 'info');
    }, 2000);
  </script>
</body>
</html>
