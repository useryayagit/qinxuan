<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>YoukuJSBridge 正确调用测试</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #000; color: #0f0; }
    .log { margin: 5px 0; white-space: pre-wrap; }
    .success { color: #0f0; }
    .error { color: #f00; }
    .info { color: #ff0; }
  </style>
</head>
<body>
  <h1>YoukuJSBridge 正确调用测试</h1>
  <div id="logs"></div>
   
  <script>
    (function() {
      var logs = document.getElementById('logs');
      
      function log(msg, className) {
        var div = document.createElement('div');
        div.className = 'log ' + (className || '');
        div.textContent = msg;
        logs.appendChild(div);
      }
      
      log('[*] 开始测试...', 'info');
      log('[*] YoukuJSBridge: ' + YoukuJSBridge, 'info');
      
      if (typeof YoukuJSBridge !== 'undefined') {
        log('\n[+] YoukuJSBridge 存在！', 'success');
        
        // 列出所有属性
        log('\n[*] YoukuJSBridge 的所有属性:', 'info');
        var props = [];
        for (var key in YoukuJSBridge) {
          props.push(key + ' (' + typeof YoukuJSBridge[key] + ')');
        }
        log(props.join('\n'), 'info');
        
        // 方式 1: 尝试调用 'a' 方法（统一入口）
        log('\n[*] 方式 1: 调用 a() 方法（统一入口）', 'info');
        try {
          // a 方法可能接受 [method_name, params]
          YoukuJSBridge.a(['doPay', '{"orderId":"TEST","amount":0.01}']);
          log('[+] a() 调用成功！', 'success');
        } catch (e) {
          log('[-] a() 失败：' + e, 'error');
        }
        
        // 方式 2: 尝试直接调用 doPay
        log('\n[*] 方式 2: 直接调用 doPay', 'info');
        try {
          var result = YoukuJSBridge.doPay('{"orderId":"TEST","amount":0.01}');
          log('[+] doPay 成功！返回值：' + result, 'success');
        } catch (e) {
          log('[-] doPay 失败：' + e, 'error');
        }
        
        // 方式 3: 使用 apply
        log('\n[*] 方式 3: 使用 apply', 'info');
        try {
          var result = YoukuJSBridge.doPay.apply(YoukuJSBridge, ['{"orderId":"TEST","amount":0.01}']);
          log('[+] apply 成功！返回值：' + result, 'success');
        } catch (e) {
          log('[-] apply 失败：' + e, 'error');
        }
        
        // 方式 4: 使用 call
        log('\n[*] 方式 4: 使用 call', 'info');
        try {
          var result = YoukuJSBridge.doPay.call(YoukuJSBridge, '{"orderId":"TEST","amount":0.01}');
          log('[+] call 成功！返回值：' + result, 'success');
        } catch (e) {
          log('[-] call 失败：' + e, 'error');
        }
        
        // 方式 5: 使用 eval
        log('\n[*] 方式 5: 使用 eval', 'info');
        try {
          var result = eval('YoukuJSBridge.doPay(\'{"orderId":"TEST","amount":0.01}\')');
          log('[+] eval 成功！返回值：' + result, 'success');
        } catch (e) {
          log('[-] eval 失败：' + e, 'error');
        }
        
        // 方式 6: 使用 Function 构造器
        log('\n[*] 方式 6: 使用 Function 构造器', 'info');
        try {
          var fn = new Function('return YoukuJSBridge["doPay"](\'{"orderId":"TEST","amount":0.01}\')');
          var result = fn();
          log('[+] Function 构造器成功！返回值：' + result, 'success');
        } catch (e) {
          log('[-] Function 构造器失败：' + e, 'error');
        }
        
        // 方式 7: 尝试调用 b 方法（可能是另一个统一入口）
        log('\n[*] 方式 7: 调用 b() 方法', 'info');
        try {
          var result = YoukuJSBridge.b('doPay', '{"orderId":"TEST","amount":0.01}');
          log('[+] b() 成功！返回值：' + result, 'success');
        } catch (e) {
          log('[-] b() 失败：' + e, 'error');
        }
        
      } else {
        log('\n[-] YoukuJSBridge 不存在', 'error');
      }
      
      log('\n[*] 测试完成', 'info');
    })();
  </script>
</body>
</html>
