<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>YoukuJSBridge 正确调用方式</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #000; color: #0f0; }
    .log { margin: 5px 0; white-space: pre-wrap; }
    .success { color: #0f0; }
    .error { color: #f00; }
    .info { color: #ff0; }
  </style>
</head>
<body>
  <h1>YoukuJSBridge 正确调用方式</h1>
  <div id="logs"></div>
   
  <script>
    (function() {
      var logs = document.getElementById('logs');
      
      function log(msg, className) {
        var div = document.createElement('div');
        div.className = 'log ' + (className || '');
        div.textContent = msg;
        logs.appendChild(div);
      }
      
      log('[*] 开始测试正确的调用方式...', 'info');
      log('[*] YoukuJSBridge 类型：' + typeof YoukuJSBridge, 'info');
      
      if (typeof YoukuJSBridge !== 'undefined') {
        log('\n[+] YoukuJSBridge 存在！', 'success');
        
        // 列出所有属性
        log('\n[*] YoukuJSBridge 的所有属性:', 'info');
        var props = [];
        for (var key in YoukuJSBridge) {
          props.push(key + ' (' + typeof YoukuJSBridge[key] + ')');
        }
        log(props.join('\n'), 'info');
        
        // 方式 1: 使用 eval 调用
        log('\n[*] 方式 1: 使用 eval 调用', 'info');
        try {
          var result = eval('YoukuJSBridge.doPay(\'{"orderId":"TEST","amount":0.01}\')');
          log('[+] eval 调用成功！\n返回值：' + result, 'success');
        } catch (e) {
          log('[-] eval 调用失败：' + e, 'error');
        }
        
        // 方式 2: 使用 Function 构造器
        log('\n[*] 方式 2: 使用 Function 构造器', 'info');
        try {
          var fn = new Function('return YoukuJSBridge["doPay"](\'{"orderId":"TEST","amount":0.01}\')');
          var result = fn();
          log('[+] Function 构造器成功！\n返回值：' + result, 'success');
        } catch (e) {
          log('[-] Function 构造器失败：' + e, 'error');
        }
        
        // 方式 3: 使用 apply
        log('\n[*] 方式 3: 使用 apply', 'info');
        try {
          var result = YoukuJSBridge.doPay.apply(YoukuJSBridge, ['{"orderId":"TEST","amount":0.01}']);
          log('[+] apply 成功！\n返回值：' + result, 'success');
        } catch (e) {
          log('[-] apply 失败：' + e, 'error');
        }
        
        // 方式 4: 使用 call
        log('\n[*] 方式 4: 使用 call', 'info');
        try {
          var result = YoukuJSBridge.doPay.call(YoukuJSBridge, '{"orderId":"TEST","amount":0.01}');
          log('[+] call 成功！\n返回值：' + result, 'success');
        } catch (e) {
          log('[-] call 失败：' + e, 'error');
        }
        
        // 方式 5: 使用方括号 + eval
        log('\n[*] 方式 5: 使用方括号 + eval', 'info');
        try {
          var method = 'doPay';
          var result = eval('YoukuJSBridge["' + method + '"](\'{"orderId":"TEST","amount":0.01}\')');
          log('[+] 方括号+eval 成功！\n返回值：' + result, 'success');
        } catch (e) {
          log('[-] 方括号+eval 失败：' + e, 'error');
        }
        
        // 测试其他方法
        log('\n[*] 测试其他方法（使用 eval）:', 'info');
        
        ['getGeolocation', 'loadUrl', 'setShareInfo', 'addItem2Cart', 'oneKeyAddCart'].forEach(function(method) {
          try {
            var code = 'YoukuJSBridge.' + method + '(\'{}\')';
            var result = eval(code);
            log('[+] ' + method + ' 成功！返回值：' + result, 'success');
          } catch (e) {
            log('[-] ' + method + ' 失败：' + e, 'error');
          }
        });
        
      } else {
        log('\n[-] YoukuJSBridge 不存在', 'error');
      }
      
      log('\n[*] 测试完成', 'info');
    })();
  </script>
</body>
</html>
