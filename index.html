<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Weex Location 测试</title>
  <style>
    body { font-family: monospace; padding: 20px; background: #000; color: #0f0; }
    .log { margin: 5px 0; white-space: pre-wrap; }
    .success { color: #0f0; }
    .error { color: #f00; }
    .info { color: #ff0; }
  </style>
</head>
<body>
  <h1>Weex Location 测试</h1>
  <div id="logs"></div>
   
  <script>
    (function() {
      var logs = document.getElementById('logs');
      
      function log(msg, className) {
        var div = document.createElement('div');
        div.className = 'log ' + (className || '');
        div.textContent = msg;
        logs.appendChild(div);
      }
      
      log('[*] 开始测试...', 'info');
      
      // 测试 HTML5 Geolocation
      if ('geolocation' in navigator) {
        log('[+] HTML5 Geolocation 可用', 'success');
        
        navigator.geolocation.getCurrentPosition(
          function(position) {
            log('[+] 获取位置成功！', 'success');
            log('纬度：' + position.coords.latitude, 'success');
            log('经度：' + position.coords.longitude, 'success');
          },
          function(error) {
            log('[-] 获取位置失败：' + error.message, 'error');
          },
          {
            enableHighAccuracy: true,
            timeout: 5000,
            maximumAge: 0
          }
        );
      } else {
        log('[-] HTML5 Geolocation 不可用', 'error');
      }
      
      // 测试 Weex location 模块
      if (typeof weex !== 'undefined') {
        log('\n[*] Weex 存在', 'info');
        
        try {
          var locationModule = weex.requireModule('location');
          log('[+] Weex location 模块可用', 'success');
          
          locationModule.getCurrentPosition(function(result) {
            log('[+] Weex location 成功！', 'success');
            log('结果：' + JSON.stringify(result), 'success');
          });
        } catch (e) {
          log('[-] Weex location 失败：' + e, 'error');
        }
      } else {
        log('\n[-] Weex 不存在', 'error');
      }
      
      // 测试所有可能的 Bridge
      var possibleBridges = [
        'YoukuJSBridge',
        'WebViewJavascriptBridge',
        'JsBridge',
        'Bridge',
        'windvane',
        'WVBridge',
        '_dsbridge'
      ];
      
      log('\n[*] 探测可能的 Bridge:', 'info');
      possibleBridges.forEach(function(bridge) {
        if (typeof window[bridge] !== 'undefined') {
          log('[+] ' + bridge + ' 存在 (类型：' + typeof window[bridge] + ')', 'success');
          
          // 尝试列出方法
          try {
            if (typeof window[bridge] === 'object') {
              var methods = [];
              for (var key in window[bridge]) {
                methods.push(key);
              }
              if (methods.length > 0) {
                log('    方法：' + methods.join(', '), 'info');
              }
            }
          } catch (e) {
            log('    枚举失败：' + e, 'error');
          }
        } else {
          log('[-] ' + bridge + ' 不存在', 'error');
        }
      });
      
      log('\n[*] 测试完成', 'info');
    })();
  </script>
</body>
</html>
